<script>
    (function() {
      var currentAngle = 0;
      var isDragging = false;
      var startX = 0;
      var baseAngle = 0;

      var rig = document.getElementById('rotating-rig');
      var angleDisplay = document.getElementById('angle-display');
      var scrub = document.getElementById('scrub-container');
      var handle = document.getElementById('scrub-handle');
      var dropBtn = document.getElementById('drop-trigger');
      var scoreDisplay = document.getElementById('score-display');
      var heldPiece = document.getElementById('held-piece');

      function updateRig(angle) {
        currentAngle = (angle % 360 + 360) % 360;
        rig.style.transform = 'rotate(' + currentAngle + 'deg)';
        var formatted = Math.round(currentAngle).toString().padStart(3, '0') + '°';
        angleDisplay.textContent = formatted;
      }

      function handleDragStart(x) {
        isDragging = true;
        startX = x;
        baseAngle = currentAngle;
      }

      function handleDragMove(x) {
        if (!isDragging) return;
        var delta = x - startX;
        var angleDelta = delta * 0.9;
        updateRig(baseAngle + angleDelta);
        
        // Minor visual displacement on scrub handle
        var boundedOffset = Math.max(-50, Math.min(50, delta * 0.4));
        handle.style.transform = 'translateX(' + boundedOffset + 'px)';
      }

      function handleDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        // Snap to nearest 60-degree increment for clean tactile feedback
        var snapped = Math.round(currentAngle / 60) * 60;
        rig.style.transition = 'transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1)';
        updateRig(snapped);
        handle.style.transition = 'transform 0.15s ease';
        handle.style.transform = 'translateX(0px)';
        setTimeout(function() {
          rig.style.transition = 'transform 75ms ease-out';
          handle.style.transition = 'none';
        }, 200);
      }

      scrub.addEventListener('mousedown', function(e) { handleDragStart(e.clientX); });
      window.addEventListener('mousemove', function(e) { handleDragMove(e.clientX); });
      window.addEventListener('mouseup', handleDragEnd);

      scrub.addEventListener('touchstart', function(e) {
        if (e.touches.length > 0) handleDragStart(e.touches[0].clientX);
      }, { passive: true });

      window.addEventListener('touchmove', function(e) {
        if (e.touches.length > 0) handleDragMove(e.touches[0].clientX);
      }, { passive: true });

      window.addEventListener('touchend', handleDragEnd);

      // Micro-interaction: Simulated drop sequence
      dropBtn.addEventListener('click', function() {
        heldPiece.style.transform = 'translateY(-48px) scale(0.7)';
        heldPiece.style.opacity = '0';
        dropBtn.style.borderColor = '#B794F4';

        setTimeout(function() {
          scoreDisplay.textContent = '3,140';
          heldPiece.style.transition = 'none';
          heldPiece.style.transform = 'translateY(16px) scale(0.6)';
          
          setTimeout(function() {
            heldPiece.style.transition = 'transform 0.25s cubic-bezier(0.17, 0.89, 0.32, 1.28), opacity 0.2s ease';
            heldPiece.style.transform = 'translateY(0) scale(1)';
            heldPiece.style.opacity = '1';
            dropBtn.style.borderColor = '#4FD1C5';
          }, 60);
        }, 220);
      });
    })();
  </script>
